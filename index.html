<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화학적 평형 3D 시뮬레이터 | 2NO₂ ⇌ N₂O₄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg-deep:#1a0f2e;
    --bg-panel:#241640;
    --bg-panel2:#2d1b52;
    --accent:#b18aff;
    --accent2:#d4b8ff;
    --accent-bright:#e6d6ff;
    --accent-strong:#9b6dff;
    --text-main:#f0e9ff;
    --text-dim:#b3a3d9;
    --border:#4a2f7a;
    --danger:#ff8a9e;
    --success:#8affc1;
    --no2-color: #b74fd8;
    --n2o4-color: #5fc9e8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background: radial-gradient(ellipse at 30% 20%, #2d1b52 0%, #1a0f2e 55%, #120a1f 100%);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--text-main);
  }
  #app{position:relative;width:100vw;height:100vh;}
  #canvas-container{position:absolute;inset:0;}
  #canvas-container canvas{display:block;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  /* ---------- Top bar ---------- */
  #topbar{
    position:absolute;top:0;left:0;right:0;height:56px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;
    background:linear-gradient(180deg, rgba(36,22,64,0.92), rgba(36,22,64,0.55));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    z-index:50;
  }
  #topbar h1{font-size:15px;font-weight:700;margin:0;color:var(--accent-bright);letter-spacing:0.2px;display:flex;align-items:center;gap:8px;}
  #topbar h1 .eq{
    font-size:14px;font-weight:500;color:var(--text-dim);
    background:rgba(177,138,255,0.12);padding:3px 10px;border-radius:20px;border:1px solid var(--border);
  }
  #topbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .tb-btn{
    background:var(--bg-panel2);border:1px solid var(--border);color:var(--text-main);
    padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:all .15s;font-family:inherit;white-space:nowrap;
  }
  .tb-btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .tb-btn.active{background:var(--danger);border-color:var(--danger);color:#3a0d18;font-weight:700;}
  .tb-btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---------- Draggable clock ---------- */
  #clock{
    position:absolute;
    top:64px; left:16px;
    z-index:60;
    background:linear-gradient(145deg, rgba(45,27,82,0.9), rgba(36,22,64,0.9));
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 14px;
    font-size:12.5px;
    color:var(--accent-bright);
    cursor:grab;
    user-select:none;
    box-shadow:0 4px 18px rgba(0,0,0,0.4);
    max-width:150px;
    line-height:1.5;
    text-align:center;
    word-break:keep-all;
  }
  #clock:active{cursor:grabbing;}
  #clock .drag-handle{font-size:9px;color:var(--text-dim);margin-bottom:2px;letter-spacing:1px;}

  /* ---------- Side panel (controls) ---------- */
  #sidepanel{
    position:absolute;top:56px;right:0;bottom:0;width:340px;
    background:linear-gradient(180deg, rgba(36,22,64,0.94), rgba(26,15,46,0.97));
    border-left:1px solid var(--border);
    overflow-y:auto;
    padding:16px;
    z-index:40;
  }
  .panel-section{
    background:rgba(177,138,255,0.06);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
  }
  .panel-section h3{
    margin:0 0 10px 0;font-size:12.5px;font-weight:700;color:var(--accent2);
    text-transform:uppercase;letter-spacing:0.5px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12.5px;}
  .row label{color:var(--text-dim);}
  .slider-row{margin-bottom:14px;}
  .slider-row .slabel{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
  .slider-row .slabel .val{color:var(--accent-bright);font-weight:700;}
  input[type=range]{
    width:100%;-webkit-appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg, var(--accent-strong), var(--border));outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent-bright);cursor:pointer;border:2px solid var(--accent-strong);
    box-shadow:0 0 8px rgba(177,138,255,0.7);
  }
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{
    flex:1;min-width:60px;background:var(--bg-panel2);border:1px solid var(--border);color:var(--text-main);
    padding:6px 8px;border-radius:7px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .mini-btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);}

  .particle-count-box{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(0,0,0,0.2);border-radius:8px;padding:8px 10px;margin-bottom:6px;
  }
  .particle-count-box .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;box-shadow:0 0 8px currentColor;}
  .particle-count-box .name{font-size:12.5px;font-weight:500;}
  .particle-count-box .count{font-size:15px;font-weight:900;color:var(--accent-bright);font-variant-numeric:tabular-nums;}

  #keq-display{
    text-align:center;padding:10px;background:rgba(0,0,0,0.25);border-radius:10px;
    font-size:13px;color:var(--text-dim);
  }
  #keq-display .kval{font-size:20px;font-weight:900;color:var(--success);display:block;margin-top:4px;}
  #keq-display.shifting .kval{color:var(--danger);}

  /* Custom species editor */
  .species-item{
    display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.2);
    padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:11.5px;
  }
  .species-item .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .species-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .species-item button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 4px;}

  input[type=text], input[type=number], select, textarea{
    width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--border);color:var(--text-main);
    padding:7px 9px;border-radius:7px;font-size:12.5px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:50px;}

  /* ---------- AI panel (bottom, draggable-ish fixed) ---------- */
  #ai-panel{
    position:absolute;left:16px;bottom:16px;width:420px;max-width:calc(100vw - 380px);
    background:linear-gradient(145deg, rgba(45,27,82,0.95), rgba(30,17,54,0.97));
    border:1px solid var(--accent-strong);border-radius:14px;
    padding:12px;z-index:45;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  #ai-panel h3{margin:0 0 8px 0;font-size:12.5px;color:var(--accent-bright);display:flex;align-items:center;gap:6px;}
  #ai-log{
    max-height:150px;overflow-y:auto;font-size:12px;margin-bottom:8px;
    display:flex;flex-direction:column;gap:6px;
  }
  .ai-msg{padding:7px 10px;border-radius:9px;line-height:1.5;}
  .ai-msg.user{background:rgba(155,109,255,0.25);align-self:flex-end;max-width:88%;}
  .ai-msg.bot{background:rgba(0,0,0,0.28);align-self:flex-start;max-width:92%;color:var(--text-dim);}
  .ai-msg.bot b{color:var(--accent-bright);}
  #ai-input-row{display:flex;gap:6px;}
  #ai-input-row input{flex:1;}
  #ai-input-row button{
    background:var(--accent-strong);border:none;color:#fff;padding:0 14px;border-radius:7px;
    cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;
  }
  #ai-input-row button:hover{background:var(--accent);}

  /* ---------- Bottom-left param toggle buttons ---------- */
  #doc-toggle-wrap{position:absolute;top:64px;right:352px;z-index:60;display:flex;flex-direction:column;gap:8px;}

  /* ---------- Modal (docs) ---------- */
  #modal-overlay{
    position:absolute;inset:0;background:rgba(10,5,20,0.75);z-index:200;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);
  }
  #modal-overlay.show{display:flex;}
  #modal-box{
    width:min(720px, 92vw);max-height:82vh;overflow-y:auto;
    background:linear-gradient(160deg, #2d1b52, #1a0f2e);
    border:1px solid var(--accent-strong);border-radius:16px;padding:26px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #modal-box h2{color:var(--accent-bright);margin-top:0;font-size:20px;border-bottom:1px solid var(--border);padding-bottom:10px;}
  #modal-box h3{color:var(--accent2);font-size:14.5px;margin-top:20px;}
  #modal-box p, #modal-box li{color:var(--text-main);font-size:13.5px;line-height:1.75;}
  #modal-box code{background:rgba(0,0,0,0.35);padding:2px 6px;border-radius:5px;color:var(--accent-bright);}
  #modal-close{
    position:sticky;top:0;float:right;background:var(--bg-panel2);border:1px solid var(--border);
    color:var(--text-main);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;
  }

  /* ---------- Recording indicator ---------- */
  #rec-indicator{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);
    background:rgba(255,60,90,0.9);color:#fff;padding:6px 16px;border-radius:20px;
    font-size:12px;font-weight:700;z-index:70;display:none;align-items:center;gap:8px;
  }
  #rec-indicator.show{display:flex;}
  #rec-indicator .rdot{width:9px;height:9px;background:#fff;border-radius:50%;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:0.2;}}

  #toast-wrap{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:rgba(45,27,82,0.95);border:1px solid var(--accent-strong);padding:9px 18px;border-radius:9px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,0.4);animation:toastin .25s ease;}
  @keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  #graph-wrap{
    position:absolute;bottom:16px;right:352px;width:300px;
    background:linear-gradient(145deg, rgba(45,27,82,0.93), rgba(30,17,54,0.95));
    border:1px solid var(--border);border-radius:12px;padding:10px;z-index:42;
  }
  #graph-wrap h4{margin:0 0 6px 0;font-size:11.5px;color:var(--accent2);display:flex;justify-content:space-between;align-items:center;}
  #graph-canvas{width:100%;height:110px;display:block;}
  .graph-btns{display:flex;gap:6px;margin-top:6px;}
  .graph-btns button{flex:1;background:var(--bg-panel2);border:1px solid var(--border);color:var(--text-main);padding:5px;border-radius:6px;font-size:10.5px;cursor:pointer;font-family:inherit;}
  .graph-btns button:hover{background:var(--accent-strong);}

  #legend{position:absolute;bottom:16px;left:16px;display:none;}

  @media (max-width:900px){
    #sidepanel{width:88vw;transform:translateX(100%);transition:transform .25s;}
    #sidepanel.open{transform:translateX(0);}
    #graph-wrap, #doc-toggle-wrap{right:16px;}
    #ai-panel{max-width:calc(100vw - 32px);width:auto;}
    #topbar h1{font-size:12px;}
    #topbar h1 .eq{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container"></div>

  <div id="topbar">
    <h1>⚗ 화학적 평형 3D 시뮬레이터 <span class="eq" id="eq-label">2NO₂ ⇌ N₂O₄</span></h1>
    <div id="topbtns">
      <button class="tb-btn" id="btn-docs-theory">📘 평형 원리</button>
      <button class="tb-btn" id="btn-docs-usage">📗 사용법</button>
      <button class="tb-btn" id="btn-screenshot">📷 캡처(PNG)</button>
      <button class="tb-btn" id="btn-record">⏺ 녹화(MP4)</button>
      <button class="tb-btn" id="btn-sound">🔊 효과음</button>
      <button class="tb-btn" id="btn-panel-toggle" style="display:none;">☰ 패널</button>
    </div>
  </div>

  <div id="rec-indicator"><span class="rdot"></span> 녹화 중...</div>

  <div id="clock"><div class="drag-handle">⋮⋮ 드래그 ⋮⋮</div><div id="clock-text">로딩중...</div></div>

  <div id="graph-wrap">
    <h4>📈 입자 수 변화 그래프 <span></span></h4>
    <canvas id="graph-canvas" width="280" height="110"></canvas>
    <div class="graph-btns">
      <button id="btn-graph-png">PNG 저장</button>
      <button id="btn-graph-reset">그래프 초기화</button>
    </div>
  </div>

  <div id="ai-panel">
    <h3>🤖 AI 컨트롤 어시스턴트</h3>
    <div id="ai-log"></div>
    <div id="ai-input-row">
      <input type="text" id="ai-input" placeholder="예: 온도를 확 낮춰서 정반응 쪽으로 밀어줘 / 부피를 반으로 줄여줘">
      <button id="ai-send">전송</button>
    </div>
  </div>

  <div id="sidepanel">
    <div class="panel-section">
      <h3>⚛ 반응 평형 상수</h3>
      <div id="keq-display">
        현재 Q (반응지수)
        <span class="kval" id="q-value">-</span>
        <div style="font-size:11px;margin-top:6px;">평형상수 Kc: <b id="kc-target-display">-</b></div>
      </div>
    </div>

    <div class="panel-section">
      <h3>🧪 반응식 선택</h3>
      <select id="reaction-select">
        <option value="no2_n2o4">2NO₂ ⇌ N₂O₄ (갈색↔무색, 발열)</option>
        <option value="n2_h2_nh3">N₂ + 3H₂ ⇌ 2NH₃ (하버법, 발열)</option>
        <option value="co_h2o_co2_h2">CO + H₂O ⇌ CO₂ + H₂ (수성가스, 발열)</option>
        <option value="custom">✏ 커스텀 반응식...</option>
      </select>
    </div>

    <div class="panel-section" id="custom-section" style="display:none;">
      <h3>🛠 커스텀 원소/분자 만들기</h3>
      <div class="row"><label>이름(화학식)</label></div>
      <input type="text" id="custom-name" placeholder="예: SO3" style="margin-bottom:6px;">
      <div class="row"><label>색상</label><input type="color" id="custom-color" value="#b18aff" style="width:50px;height:26px;padding:0;border:none;"></div>
      <div class="row"><label>화학양론 계수</label><input type="number" id="custom-coef" value="1" min="1" max="6" style="width:70px;"></div>
      <div class="row"><label>반응물/생성물</label>
        <select id="custom-side" style="width:110px;"><option value="reactant">반응물</option><option value="product">생성물</option></select>
      </div>
      <button class="mini-btn" id="custom-add" style="margin-top:6px;width:100%;">+ 추가</button>
      <div id="species-list" style="margin-top:10px;"></div>
      <button class="mini-btn" id="custom-apply" style="width:100%;margin-top:6px;background:var(--accent-strong);">✓ 커스텀 반응식 적용</button>
    </div>

    <div class="panel-section">
      <h3>📊 실시간 입자 수</h3>
      <div id="particle-counts"></div>
    </div>

    <div class="panel-section">
      <h3>🌡 온도 조절</h3>
      <div class="slider-row">
        <div class="slabel"><span>온도 (K)</span><span class="val" id="temp-val">298 K</span></div>
        <input type="range" id="temp-slider" min="150" max="600" value="298" step="1">
      </div>
      <div class="btnrow">
        <button class="mini-btn" data-temp="-50">-50K</button>
        <button class="mini-btn" data-temp="-10">-10K</button>
        <button class="mini-btn" data-temp="10">+10K</button>
        <button class="mini-btn" data-temp="50">+50K</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>📦 부피 조절</h3>
      <div class="slider-row">
        <div class="slabel"><span>부피 배율</span><span class="val" id="vol-val">1.0x</span></div>
        <input type="range" id="vol-slider" min="30" max="300" value="100" step="1">
      </div>
      <div class="btnrow">
        <button class="mini-btn" id="vol-half">부피 ÷2</button>
        <button class="mini-btn" id="vol-double">부피 ×2</button>
        <button class="mini-btn" id="vol-reset">초기화</button>
      </div>
    </div>

    <div class="panel-section" id="species-count-section">
      <h3>➕ 입자 수 직접 조정</h3>
      <div id="species-sliders"></div>
    </div>

    <div class="panel-section">
      <h3>⚙ 시뮬레이션</h3>
      <div class="btnrow" style="margin-bottom:8px;">
        <button class="mini-btn" id="btn-play">⏸ 일시정지</button>
        <button class="mini-btn" id="btn-reset-sim">🔄 초기화</button>
      </div>
      <div class="slider-row">
        <div class="slabel"><span>시뮬레이션 속도</span><span class="val" id="speed-val">1.0x</span></div>
        <input type="range" id="speed-slider" min="10" max="300" value="100" step="10">
      </div>
      <div class="row"><label>카메라 자동회전</label><input type="checkbox" id="auto-rotate" checked></div>
    </div>
  </div>

  <div id="toast-wrap"></div>
  <div id="modal-overlay"><div id="modal-box"><button id="modal-close">✕</button><div id="modal-content"></div></div></div>
</div>

<script src="theory-content.js"></script>
<script src="usage-content.js"></script>
<script src="ai-parser.js"></script>
<script src="app.js"></script>
</body>
</html>
